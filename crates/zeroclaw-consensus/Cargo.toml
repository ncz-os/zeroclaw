[package]
name = "zeroclaw-consensus"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Multi-model consensus review (panel / majority / debate) over any ModelProvider."
publish = false

[dependencies]
zeroclaw-api.workspace = true
anyhow = "1.0"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }

[dev-dependencies]
tokio = { version = "1.50", default-features = false, features = ["rt-multi-thread", "macros"] }
