name: Daily HEAD sync and build

# WHY THIS EXISTS
# ncz-os/zeroclaw is a FORK of zeroclaw-labs/zeroclaw. zoder needs no sync step
# because it is our own project; this repo does, and it never had one. The
# fork-sync cron on ULTRA was disabled on 2026-06-28 when the perlowja fork was
# retired and was never repointed here, so master silently fell 73 commits / 8
# days behind upstream while the fleet consumed nightly assets built from it.
#
# BRANCH MODEL -- this matters, and it is why the sync does not touch master.
#   master        our fork's branch: upstream code PLUS this CI overlay
#   upstream-head a PURE mirror of zeroclaw-labs/zeroclaw master, no local commits
#
# The daily job fast-forwards `upstream-head` and builds THAT. Keeping the mirror
# separate means the sync is always a clean fast-forward and never needs a force
# push, so a local commit on master can never be silently destroyed. Syncing into
# master directly would have required force-pushing over our own CI commit -- the
# exact failure mode that killed the previous fork-sync arrangement.
#
# It builds every day even when nothing changed: a build that only runs on change
# cannot tell you yesterday's HEAD went red today from a refreshed dependency
# graph.

on:
  schedule:
    - cron: "0 8 * * *"      # 08:00 UTC, an hour before zoder's nightly
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: daily-head
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.ff.outputs.sha }}
      changed: ${{ steps.ff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The default GITHUB_TOKEN is a GitHub App token, and GitHub refuses
          # to let an App create or update files under .github/workflows -
          # a hard anti-injection rule that no `permissions:` key overrides.
          # Upstream commits routinely touch workflows, so every sync since at
          # least 2026-08-02 failed with:
          #   ! [remote rejected] upstream-head -> upstream-head (refusing to
          #     allow a GitHub App to create or update workflow ...)
          # SYNC_TOKEN is a personal token carrying the `workflow` scope, which
          # is the only thing permitted to push those paths.
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Fast-forward the upstream-head mirror
        id: ff
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/zeroclaw-labs/zeroclaw.git
          git fetch upstream master --tags
          # Seed the mirror on first run; thereafter only ever fast-forward it.
          if git ls-remote --exit-code --heads origin upstream-head >/dev/null 2>&1; then
            git fetch origin upstream-head:upstream-head
          else
            git branch upstream-head upstream/master
          fi
          git checkout upstream-head
          BEFORE=$(git rev-parse HEAD)
          UP=$(git rev-parse upstream/master)
          echo "fork:     $BEFORE"
          echo "upstream: $UP"

          if [ "$BEFORE" = "$UP" ]; then
            echo "already current"
            echo "sha=$UP" >> "$GITHUB_OUTPUT"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Refuse to force. If the fork has commits upstream does not, a
          # fast-forward would destroy them and that must be a human decision.
          AHEAD=$(git rev-list --count upstream/master..HEAD)
          if [ "$AHEAD" != "0" ]; then
            echo "::error::upstream-head has $AHEAD commit(s) not in upstream; refusing to force-sync"
            git log --oneline upstream/master..HEAD
            exit 1
          fi

          BEHIND=$(git rev-list --count HEAD..upstream/master)
          echo "::notice::fast-forwarding $BEHIND commit(s) to $UP"
          git merge --ff-only upstream/master
          git push origin upstream-head
          echo "sha=$UP" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

  build-head:
    needs: sync
    # TWO LINUX TARGETS, NO DARWIN BUILD. Macs are served by the aarch64 Linux
    # binary inside podman/docker, so a native macOS build would be dead weight:
    # an extra runner, an extra toolchain and an extra artifact nobody consumes.
    # ubuntu-24.04-arm is a native arm64 runner (free on public repos), which
    # avoids cross-compilation and the linker/sysroot problems that come with it.
    strategy:
      fail-fast: false          # one arch failing must not hide the other's result
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.sha }}

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.1"          # matches the workspace rust-version
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}

      # Build HEAD every day even when nothing changed. A build that only runs on
      # change cannot tell you that yesterday's HEAD still builds today with a
      # refreshed dependency graph -- which is how a green project turns red
      # without a single commit landing.
      - name: Build release binary from HEAD
        run: cargo build --release --locked --bin zeroclaw --target ${{ matrix.target }}

      - name: Stage artifact with provenance
        id: prov
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          BIN=target/${{ matrix.target }}/release/zeroclaw
          test -x "$BIN"
          # Arch-suffixed so the two matrix legs cannot overwrite each other in
          # the shared release -- an unsuffixed name silently keeps whichever
          # job finished last.
          cp "$BIN" "zeroclaw-${{ matrix.arch }}-linux"
          echo "$SHA" > "GIT_COMMIT-${{ matrix.arch }}"
          {
            echo "commit=$SHA"
            echo "arch=${{ matrix.arch }}"
            echo "target=${{ matrix.target }}"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "upstream=zeroclaw-labs/zeroclaw"
            echo "toolchain=1.96.1"
          } > "BUILD_INFO-${{ matrix.arch }}"
          echo "sha_short=${SHA:0:10}" >> "$GITHUB_OUTPUT"
          echo "stamp=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          ls -la "zeroclaw-${{ matrix.arch }}-linux"

      # Hand the compiled binary to the image job rather than have the container
      # recompile from source. The repo Dockerfile is a full multi-stage Rust
      # build; running it per-platform would compile the workspace twice more
      # for artifacts we already have.
      - name: Upload binary for the image job
        uses: actions/upload-artifact@v4
        with:
          name: zeroclaw-${{ matrix.arch }}
          path: zeroclaw-${{ matrix.arch }}-linux
          retention-days: 1

      - name: Publish into the rolling HEAD release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: head-${{ steps.prov.outputs.stamp }}
          name: "HEAD ${{ steps.prov.outputs.stamp }} (${{ steps.prov.outputs.sha_short }})"
          body: |
            Daily build of upstream HEAD, tracked for fleet distribution.

            * commit: `${{ steps.prov.outputs.sha_short }}`
            * source: zeroclaw-labs/zeroclaw master, mirrored to `upstream-head`
            * toolchain: 1.96.1, `cargo build --release --locked`

            **Targets**

            | asset | for |
            |---|---|
            | `zeroclaw-x86_64-linux`  | TYPHON, PROTEUS, ACHILLES, forge workers |
            | `zeroclaw-aarch64-linux` | TYDEUS, bigpi, clawpi — and macOS hosts via podman/docker |

            There is deliberately no macOS binary: Macs run the aarch64 Linux
            build in a container, so a native Darwin artifact would be one more
            thing to build and nothing to consume it.

            These are untriaged upstream builds, not curated releases. They exist
            so drift between this fork and upstream surfaces the day it happens.
          files: |
            zeroclaw-${{ matrix.arch }}-linux
            GIT_COMMIT-${{ matrix.arch }}
            BUILD_INFO-${{ matrix.arch }}
          fail_on_unmatched_files: true

  publish-image:
    needs: [sync, build-head]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.sha }}

      - name: Collect both arch binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Lay out a per-platform build context
        id: ctx
        run: |
          set -euo pipefail
          # buildx resolves $TARGETARCH per platform, so the binaries are staged
          # under docker's arch names (amd64/arm64), not rust triples.
          mkdir -p dist/amd64 dist/arm64
          install -m755 artifacts/zeroclaw-x86_64/zeroclaw-x86_64-linux   dist/amd64/zeroclaw
          install -m755 artifacts/zeroclaw-aarch64/zeroclaw-aarch64-linux dist/arm64/zeroclaw
          cat > Containerfile.head <<'DOCKERFILE'
          # Daily HEAD image. Packages the binaries built by the build-head matrix
          # instead of recompiling; the source build lives in the repo Dockerfile
          # and is used for tagged releases.
          # trixie, not bookworm: the build-head matrix compiles on ubuntu-24.04
          # runners (glibc 2.39) and bookworm ships glibc 2.36. glibc is
          # backward compatible, not forward, so a bookworm runtime rejects the
          # binary at exec with "version `GLIBC_2.39' not found". trixie is
          # glibc 2.41.
          FROM debian:trixie-slim
          ARG TARGETARCH
          ARG ZC_COMMIT
          RUN apt-get update \
           && apt-get install -y --no-install-recommends ca-certificates git \
           && rm -rf /var/lib/apt/lists/*
          COPY dist/${TARGETARCH}/zeroclaw /usr/local/bin/zeroclaw
          RUN /usr/local/bin/zeroclaw --version
          LABEL org.opencontainers.image.source="https://github.com/ncz-os/zeroclaw" \
                org.opencontainers.image.revision="${ZC_COMMIT}" \
                org.opencontainers.image.description="Daily build of zeroclaw-labs HEAD (untriaged)"
          ENTRYPOINT ["/usr/local/bin/zeroclaw"]
          DOCKERFILE
          echo "stamp=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          ls -la dist/amd64 dist/arm64

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags are namespaced `head-*` on purpose: docker-publish.yml owns the
      # release tags from dev/ci/docker-tags.toml, and these untriaged daily
      # builds must never land on one of those.
      - name: Build and push multi-arch HEAD image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile.head
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: |
            ZC_COMMIT=${{ needs.sync.outputs.sha }}
          tags: |
            ghcr.io/ncz-os/zeroclaw:head
            ghcr.io/ncz-os/zeroclaw:head-${{ steps.ctx.outputs.stamp }}
            ghcr.io/ncz-os/zeroclaw:head-${{ needs.sync.outputs.sha }}

      - name: Verify both platforms are in the manifest
        run: |
          set -euo pipefail
          # A multi-arch push that silently produced one platform would look
          # identical to success from the build step alone.
          docker buildx imagetools inspect ghcr.io/ncz-os/zeroclaw:head-${{ steps.ctx.outputs.stamp }} \
            | tee /tmp/manifest.txt
          for p in linux/amd64 linux/arm64; do
            grep -q "$p" /tmp/manifest.txt || { echo "::error::$p missing from manifest"; exit 1; }
          done
          echo "both platforms present"
