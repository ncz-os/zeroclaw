name: Daily master sync with upstream

# WHY THIS EXISTS
# master carries upstream code PLUS a small local overlay (CI tweaks and a
# few real security/dependency fixes) -- see the incident writeup at
# mem_1788554401504_43c396. Unlike `upstream-head` (a pure fast-forward
# mirror maintained by daily-head-sync-build.yml), master can never be
# simply fast-forwarded because it carries its own commits. Nothing kept
# master in sync going forward after the one-off manual resync on
# 2026-08-04 (commit b39838c3) -- it silently drifted 421 commits / ~1 month
# behind upstream zeroclaw-labs/zeroclaw while native-builds.yml (in
# ncz-os/zoder) kept building from it and reporting green every day.
#
# This job runs a real merge every day and pushes it IF AND ONLY IF the
# merge is clean. A conflict means a human resolves it by hand -- the job
# FAILS LOUDLY and pushes nothing, because a silent skip here is exactly
# the failure mode that let master drift undetected for a month.

on:
  schedule:
    # 08:30 UTC -- after daily-head-sync-build.yml's upstream-head refresh
    # (08:00 UTC) and before ncz-os/zoder's native-builds.yml (09:15 UTC),
    # so a build never reads a master mid-sync.
    - cron: "30 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: master-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master
          # Same token as daily-head-sync-build.yml. A merge onto master can
          # touch .github/workflows/* (upstream routinely does), and GitHub
          # refuses to let the default GitHub App token create or update
          # files under that path -- SYNC_TOKEN is a personal token carrying
          # the `workflow` scope, which is the only thing permitted to push
          # those paths.
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Test source synchronization contract
        run: python3 scripts/ci/fork_sync_test.py

      - name: Reconcile both forges and merge upstream HEAD
        env:
          GITLAB_SYNC_TOKEN: ${{ secrets.GITLAB_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "ncz-os-sync-bot"
          git config user.email "sync@ncz-os.local"
          git remote add upstream https://github.com/zeroclaw-labs/zeroclaw.git
          git fetch upstream master
          test -n "$GITLAB_SYNC_TOKEN" || { echo "::error::GITLAB_SYNC_TOKEN is required"; exit 1; }
          git remote add canonical https://gitlab.com/ncz-os/zeroclaw.git
          auth_header="Authorization: Basic $(printf 'oauth2:%s' "$GITLAB_SYNC_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth_header"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://gitlab.com/.extraheader
          export GIT_CONFIG_VALUE_0="$auth_header"
          git fetch canonical master
          # Preserve commits from either forge. Never force or overwrite a
          # security fix that landed only on the canonical GitLab branch.
          git merge --no-edit canonical/master

          BEFORE="$(git rev-parse HEAD)"
          UP="$(git rev-parse upstream/master)"
          echo "master:            $BEFORE"
          echo "upstream/master:   $UP"

          BEHIND="$(git rev-list --count HEAD..upstream/master)"
          echo "master is $BEHIND commit(s) behind upstream/master"

          if git merge upstream/master --no-edit \
              -m "merge: daily sync master with upstream zeroclaw-labs master ($(date -u +%Y-%m-%d))"; then
            # A clean text merge can still duplicate dependency keys; verify
            # manifests before either forge is advanced.
            python3 - <<'PYTHON'
          import pathlib, tomllib
          for path in pathlib.Path('.').rglob('Cargo.toml'):
              tomllib.loads(path.read_text())
          PYTHON
            git push canonical HEAD:master
            git push origin HEAD:master
            SHA=$(git rev-parse HEAD)
            test "$(git ls-remote canonical refs/heads/master | cut -f1)" = "$SHA"
            test "$(git ls-remote origin refs/heads/master | cut -f1)" = "$SHA"
            echo "::notice::synced $BEHIND upstream commits; both forges at $SHA"
          else
            echo "::error::master has a merge conflict with upstream/master ($BEHIND commits behind) that needs human resolution."
            echo "conflicting files:"
            git diff --name-only --diff-filter=U
            git merge --abort
            echo "::error::merge aborted -- master was NOT changed and NOT pushed. Resolve by hand: git fetch upstream master && git merge upstream/master"
            exit 1
          fi
