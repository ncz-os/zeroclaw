[package]
name = "zoder"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Cost-governed, free-first coding CLI — a ZeroClaw distro."
publish = false

[[bin]]
name = "zoder"
path = "src/main.rs"

[dependencies]
zeroclaw-api.workspace = true
zeroclaw-providers.workspace = true
zeroclaw-config = { workspace = true, default-features = false }
zeroclaw-consensus.workspace = true
zeroclaw-cost-governance.workspace = true
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1.50", default-features = false, features = ["rt-multi-thread", "macros"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
directories.workspace = true
